                border: 1px solid #30363d;
                border-radius: 24px;
                padding: 28px 20px;
                text-align: center;
                box-shadow: 0 12px 30px rgba(0,0,0,0.5);
                margin-bottom: 24px;
              }
              .repo-logo {
                width: 80px;
                height: 80px;
                border-radius: 20px;
                margin: 0 auto 14px;
                display: block;
                border: 2px solid #e5c07b;
                box-shadow: 0 4px 16px rgba(229, 192, 123, 0.25);
              }
              h1 { font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 6px; }
              .sub { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
              .btn-grid {
                display: flex;
                flex-direction: column;
                gap: 10px;
                margin-bottom: 16px;
              }
              .btn {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                text-decoration: none;
                padding: 14px 18px;
                border-radius: 14px;
                font-weight: 700;
                font-size: 15px;
                transition: transform 0.15s ease, opacity 0.15s ease;
              }
              .btn:active { transform: scale(0.98); }
              .btn-sileo { background: #e5c07b; color: #1a160d; }
              .btn-zebra { background: #21262d; color: #58a6ff; border: 1px solid #30363d; }
              .url-card {
                background: #0b0d0e;
                border: 1px dashed #30363d;
