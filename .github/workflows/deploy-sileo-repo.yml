name: Deploy Sileo APT Repo & Products

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'packages/**'
      - 'downloads/**'
      - 'depictions/**'
      - 'icons/**'
      - 'Resources/**'
      - '.github/workflows/deploy-sileo-repo.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Lý do cập nhật kho Sileo'
        required: false
        default: 'Cập nhật kho sản phẩm Sileo tự động'
  repository_dispatch:
    types: [publish_package]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install APT Repository Tools (dpkg-dev, xz, bzip2, zstd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev xz-utils bzip2 zstd python3

      - name: Prepare Staging Directory & Products
        run: |
          STAGE="$GITHUB_WORKSPACE/sileo_stage"
          mkdir -p "$STAGE/debs" "$STAGE/downloads" "$STAGE/icons" "$STAGE/depictions"

          # 1. Copy all .deb packages
          if [ -d "packages" ]; then
            cp -v packages/*.deb "$STAGE/debs/" 2>/dev/null || true
          fi
          if [ -d "OUT_PACKAGES_V3" ]; then
            cp -v OUT_PACKAGES_V3/*.deb "$STAGE/debs/" 2>/dev/null || true
          fi

          # 2. Copy downloads (.tipa, .apk, .ipa)
          if [ -d "downloads" ]; then
            cp -rv downloads/* "$STAGE/downloads/" 2>/dev/null || true
          fi
          if [ -d "OUT_PACKAGES_V3" ]; then
            cp -v OUT_PACKAGES_V3/*.tipa OUT_PACKAGES_V3/*.ipa "$STAGE/downloads/" 2>/dev/null || true
            cp -v OUT_PACKAGES_V3/*.tipa "$STAGE/debs/" 2>/dev/null || true
          fi

          # 3. Copy icons & depictions
          if [ -d "icons" ]; then
            cp -rv icons/* "$STAGE/icons/" 2>/dev/null || true
          fi
          if [ -d "depictions" ]; then
            cp -rv depictions/* "$STAGE/depictions/" 2>/dev/null || true
          fi

          # 4. Copy resources (CydiaIcon, admin.html, licenses.json)
          if [ -d "Resources" ]; then
            cp -v Resources/CydiaIcon*.png "$STAGE/" 2>/dev/null || true
            cp -v Resources/admin.html "$STAGE/admin.html" 2>/dev/null || true
            cp -v Resources/licenses.json "$STAGE/licenses.json" 2>/dev/null || true
          fi

          # Preserve existing online licenses.json from gh-pages if available
          if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/licenses.json" -o "$STAGE/licenses_live.json"; then
            if grep -q '"keys"' "$STAGE/licenses_live.json"; then
              mv "$STAGE/licenses_live.json" "$STAGE/licenses.json"
            else
              rm -f "$STAGE/licenses_live.json"
            fi
          fi

      - name: Build APT Indexes (Packages & Checksums)
        run: |
          STAGE="$GITHUB_WORKSPACE/sileo_stage"
          cd "$STAGE"

          # Scan packages into Packages index
          dpkg-scanpackages -m debs > Packages
          
          # Compress with gzip, bzip2, xz, zstd
          gzip -c9 Packages > Packages.gz
          bzip2 -c9 Packages > Packages.bz2
          xz -c9 Packages > Packages.xz
          zstd -c19 Packages -o Packages.zst

          # Generate Release with valid MD5, SHA1, SHA256 checksums
          python3 - << 'EOF'
          import hashlib, os

          files = ['Packages', 'Packages.gz', 'Packages.bz2', 'Packages.xz', 'Packages.zst']
          valid_files = [f for f in files if os.path.exists(f)]

          def get_hash(fn, algo):
              h = getattr(hashlib, algo)()
              with open(fn, 'rb') as f:
                  while chunk := f.read(65536):
                      h.update(chunk)
              return h.hexdigest(), os.path.getsize(fn)

          header = """Origin: gaulmt Official Sileo Repo
Label: gaulmt Repo
Suite: stable
Version: 1.0
Codename: ios
Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
Components: main
Description: Kho ung dung, tweak & san pham gaulmt tren Sileo & Zebra
"""

          for algo_name, algo_key in [('MD5Sum', 'md5'), ('SHA1', 'sha1'), ('SHA256', 'sha256')]:
              header += f"{algo_name}:\n"
              for fn in valid_files:
                  digest, size = get_hash(fn, algo_key)
                  header += f" {digest} {size} {fn}\n"

          with open('Release', 'w', encoding='utf-8') as f:
              f.write(header)
          EOF

      - name: Generate Responsive Web Landing Page (index.html)
        run: |
          STAGE="$GITHUB_WORKSPACE/sileo_stage"
          cd "$STAGE"

          cat << 'EOF' > index.html
