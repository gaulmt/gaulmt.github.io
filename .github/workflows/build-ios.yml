name: Build gaulmt -Tech iOS & Deploy Sileo Repo

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Theos & Dependencies (ldid, dpkg, xz)
        run: |
          brew install ldid dpkg xz
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Rootful .deb (Standard iphoneos-arm) & TrollStore .tipa
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build_out"
          if [ -f "ZTech_iOS/Makefile" ]; then cd ZTech_iOS; fi
          tr -d '\r' < layout/DEBIAN/postinst > layout/DEBIAN/postinst.lf
          mv layout/DEBIAN/postinst.lf layout/DEBIAN/postinst
          chmod 0755 layout/DEBIAN/postinst
          rm -rf packages .theos
          set -o pipefail
          make clean package FINALPACKAGE=1 messages=yes 2>&1 | tee build_rootful.log
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ] || [ ! -d packages ] || [ -z "$(ls -A packages/*.deb 2>/dev/null)" ]; then
            echo "### ❌ Build Failure Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 build_rootful.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp packages/*.deb "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootful_arm.deb"

          mkdir -p "$GITHUB_WORKSPACE/build_out/Payload"
          APP_PATH=$(find .theos -name "ZTech.app" -type d | head -n 1)
          cp -r "$APP_PATH" "$GITHUB_WORKSPACE/build_out/Payload/ZTech.app"
          cd "$GITHUB_WORKSPACE/build_out"
          zip -r9 gaulmt_Tech_TrollStore.tipa Payload
          cp gaulmt_Tech_TrollStore.tipa gaulmt_Tech_App.ipa
          rm -rf Payload

      - name: Build Rootless .deb (Dopamine / palera1n iphoneos-arm64)
        run: |
          if [ -f "ZTech_iOS/Makefile" ]; then cd ZTech_iOS; fi
          cp control control.bak
          sed -i '' 's/^Package: com.ztech.devicechanger/Package: com.ztech.devicechanger.rootless/' control
          sed -i '' 's/^Name: gaulmt -Tech/Name: gaulmt -Tech (Rootless)/' control
          chmod 0755 layout/DEBIAN/postinst
          rm -rf packages .theos
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootless_arm64.deb"
          mv control.bak control

      - name: Generate Sileo APT Repository (Root + ztech-ios + ZTech-iOS)
        run: |
          STAGE_DIR="$GITHUB_WORKSPACE/sileo_stage"
          mkdir -p "$STAGE_DIR/debs"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootful_arm.deb" "$STAGE_DIR/debs/gaulmt_Tech_Rootful_arm.deb"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootless_arm64.deb" "$STAGE_DIR/debs/gaulmt_Tech_Rootless_arm64.deb"

          if [ -f "ZTech_iOS/Resources/CydiaIcon.png" ]; then
            cp ZTech_iOS/Resources/CydiaIcon*.png "$STAGE_DIR/"
            cp ZTech_iOS/Resources/admin.html "$STAGE_DIR/admin.html"
            cp ZTech_iOS/Resources/licenses.json "$STAGE_DIR/licenses.json"
          elif [ -f "Resources/CydiaIcon.png" ]; then
            cp Resources/CydiaIcon*.png "$STAGE_DIR/"
            cp Resources/admin.html "$STAGE_DIR/admin.html"
            cp Resources/licenses.json "$STAGE_DIR/licenses.json"
          fi

          # Preserve existing online customer licenses.json from gh-pages if available
          if curl -fsSL "https://raw.githubusercontent.com/gaulmt/gaulmt.github.io/gh-pages/licenses.json" -o "$STAGE_DIR/licenses_live.json"; then
            if grep -q '"keys"' "$STAGE_DIR/licenses_live.json"; then
              mv "$STAGE_DIR/licenses_live.json" "$STAGE_DIR/licenses.json"
            else
              rm -f "$STAGE_DIR/licenses_live.json"
            fi
          fi

          cd "$STAGE_DIR"
          dpkg-scanpackages -m debs > Packages
          gzip -c9 Packages > Packages.gz
          bzip2 -c9 Packages > Packages.bz2
          xz -c9 Packages > Packages.xz

          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootless_arm64.deb" "$STAGE_DIR/debs/ZTech_Rootless_arm64.deb"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootful_arm.deb" "$STAGE_DIR/debs/ZTech_Rootful_arm.deb"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_TrollStore.tipa" "$STAGE_DIR/debs/gaulmt_Tech_TrollStore.tipa"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_TrollStore.tipa" "$STAGE_DIR/debs/ZTech_TrollStore.tipa"

          cat << 'EOF' > Release
          Origin: gaulmt -Tech Official Repo
          Label: gaulmt -Tech
          Suite: stable
          Version: 5.5.0
          Codename: ios
          Architectures: iphoneos-arm iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Nguon cai dat gaulmt -Tech v5.5.0 truc tiep tren Sileo & Zebra (Tich Hop Chan Doan & Fake AIDA64 / Zalo)
          EOF

          cat << 'EOF' > depiction.json
          {
            "minVersion": "0.1",
            "class": "DepictionTabView",
            "tabs": [
              {
                "tabname": "Chi tiết",
                "class": "DepictionStackView",
                "views": [
                  {
                    "class": "DepictionSubheaderView",
                    "useBoldText": true,
                    "title": "gaulmt -Tech v5.5.0 - Tích Hợp Chẩn Đoán Thiết Bị & Fake Hoàn Hảo AIDA64 / Zalo"
                  },
                  {
                    "class": "DepictionMarkdownView",
                    "markdown": "Bản cập nhật **gaulmt -Tech v5.5.0** mang đến công cụ chẩn đoán chuyên sâu và sửa triệt để nhận diện phần cứng:\n\n- **Tích Hợp Chức Năng 'Chẩn Đoán & Copy'**: Khách hàng chỉ cần bấm 1 nút trong app, toàn bộ thông tin về kiểu Jailbreak (Dopamine/palera1n/Rootful), thư viện Hook (ElleKit/Substrate), tình trạng Tweak, cấu trúc quyền hạn thư mục Zalo và AIDA64 sẽ được sao chép ngay để gửi hỗ trợ kỹ thuật.\n- **Lệnh CLI ztech-diag**: Bổ sung lệnh terminal `/var/jb/usr/bin/ztech-diag` để kiểm tra nhanh môi trường qua NewTerm / SSH.\n- **Fake Phần Cứng Hoàn Hảo 100% Cho AIDA64 & Zalo**: Chặn đứng toàn bộ tầng POSIX `sysctl`, `sysctlbyname`, `uname` và khớp bộ lọc `Executables = ( 'AIDA64', 'aida64', 'Zalo' )`.\n- **Tối Ưu Quyền Hạn Mobile (501:501)**: Ghi profile và phân quyền trực tiếp vào Documents của Zalo và AIDA64, không bị lỗi Sandbox."
                  }
                ]
              }
            ]
          }
          EOF

          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="vi">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
            <title>gaulmt -Tech Official Sileo Repo</title>
            <style>
              body { background:#0b0d0b; color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; padding:24px; max-width:480px; margin:0 auto; text-align:center; }
              .card { background:#141714; border:1px solid #333629; border-radius:20px; padding:24px; margin-top:20px; }
              .logo { width:72px; height:72px; border-radius:16px; margin:0 auto 12px; display:block; }
              h1 { font-size:30px; margin:0 0 6px; color:#fff; }
              .sub { color:#babfb8; font-size:15px; margin-bottom:20px; }
              .btn { display:block; text-decoration:none; padding:16px; border-radius:14px; font-weight:700; font-size:17px; margin:12px 0; }
              .btn-sileo { background:#eae0b7; color:#232119; }
              .btn-zebra { background:#1e221e; color:#fff; border:1px solid #3c4032; }
              .url-box { background:#0b0d0b; border:1px dashed #555; padding:12px; border-radius:10px; font-family:monospace; color:#dec882; font-size:14px; word-break:break-all; margin-top:12px; }
            </style>
          </head>
          <body>
            <div class="card">
              <img class="logo" src="CydiaIcon@3x.png" alt="GT Logo">
              <h1>gaulmt -Tech</h1>
              <div class="sub">Nguồn cài đặt v5.5.0 trực tiếp vào Sileo & Zebra</div>
              <a class="btn btn-sileo" href="sileo://source/https://gaulmt.github.io/">➕ Thêm nguồn vào Sileo ngay</a>
              <a class="btn btn-zebra" href="zbra://sources/add/https://gaulmt.github.io/">➕ Thêm nguồn vào Zebra</a>
              <a class="btn btn-zebra" href="apple-magnifier://install?url=https://gaulmt.github.io/debs/gaulmt_Tech_TrollStore.tipa">⚡ Cài trực tiếp qua TrollStore</a>
              <p style="color:#9ba19b;font-size:13px;margin-top:20px;">Hoặc copy link nguồn ngắn gọn dưới đây dán vào Sileo:</p>
              <div class="url-box">https://gaulmt.github.io/</div>
            </div>
          </body>
          </html>
          EOF

          REPO_DIR="$GITHUB_WORKSPACE/sileo_repo"
          mkdir -p "$REPO_DIR" "$REPO_DIR/ztech-ios"
          cp -r "$STAGE_DIR/"* "$REPO_DIR/"
          cp -r "$STAGE_DIR/"* "$REPO_DIR/ztech-ios/"

      - name: Deploy Sileo Repo to gh-pages branch
        run: |
          cd "$GITHUB_WORKSPACE/sileo_repo"
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy Multi-Path Sileo APT Repository v5.5.0"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Upload Built Packages (.deb, .tipa, .ipa)
        uses: actions/upload-artifact@v4
        with:
          name: gaulmt-Tech-iOS-Packages
          path: |
            build_out/*.deb
            build_out/*.tipa
            build_out/*.ipa
          if-no-files-found: error
