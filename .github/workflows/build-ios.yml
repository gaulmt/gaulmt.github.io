name: Build gaulmt -Tech iOS & Deploy Sileo Repo

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Sources/**'
      - 'Tweak/**'
      - 'NowEvent_iOS/**'
      - 'Makefile'
      - 'control'
      - 'entitlements.xml'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Theos & Dependencies (ldid, dpkg, xz)
        run: |
          brew install ldid dpkg xz
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build Rootful .deb (Standard iphoneos-arm) & TrollStore .tipa
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build_out"
          if [ -f "ZTech_iOS/Makefile" ]; then cd ZTech_iOS; fi
          tr -d '\r' < layout/DEBIAN/postinst > layout/DEBIAN/postinst.lf
          mv layout/DEBIAN/postinst.lf layout/DEBIAN/postinst
          chmod 0755 layout/DEBIAN/postinst
          rm -rf packages .theos
          set -o pipefail
          make clean package FINALPACKAGE=1 messages=yes 2>&1 | tee build_rootful.log
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ] || [ ! -d packages ] || [ -z "$(ls -A packages/*.deb 2>/dev/null)" ]; then
            echo "### ❌ Build Failure Log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 build_rootful.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cp packages/*.deb "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootful_arm.deb"

          mkdir -p "$GITHUB_WORKSPACE/build_out/Payload"
          APP_PATH=$(find .theos -name "ZTech.app" -type d | head -n 1)
          cp -r "$APP_PATH" "$GITHUB_WORKSPACE/build_out/Payload/ZTech.app"
          cd "$GITHUB_WORKSPACE/build_out"
          zip -r9 gaulmt_Tech_TrollStore.tipa Payload
          cp gaulmt_Tech_TrollStore.tipa gaulmt_Tech_App.ipa
          rm -rf Payload

      - name: Build Rootless .deb (Dopamine / palera1n iphoneos-arm64)
        run: |
          if [ -f "ZTech_iOS/Makefile" ]; then cd ZTech_iOS; fi
          cp control control.bak
          sed -i '' 's/^Package: com.ztech.devicechanger/Package: com.ztech.devicechanger.rootless/' control
          sed -i '' 's/^Name: quang lam marketing/Name: quang lam marketing (Rootless)/' control
          sed -i '' 's/^Depends: .*/Depends: firmware (>= 12.0), ellekit/' control
          chmod 0755 layout/DEBIAN/postinst
          rm -rf packages .theos
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          cp packages/*.deb "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootless_arm64.deb"
          mv control.bak control

      - name: Build NowEvent iOS .deb (Rootful, Rootless) & TrollStore .tipa / .ipa
        run: |
          set -e
          set -x
          if [ -d "NowEvent_iOS" ]; then
            echo "=== Building NowEvent iOS ==="
            cd NowEvent_iOS
            rm -rf packages .theos build_nen.log

            # 1. Compile Mach-O binary with Theos
            make clean all FINALPACKAGE=1 messages=yes 2>&1 | tee build_nen.log
            BUILD_STATUS=${PIPESTATUS[0]}
            if [ $BUILD_STATUS -ne 0 ]; then
              echo "### ❌ NowEvent Compilation Failure" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -n 80 build_nen.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            # Locate compiled binary
            NEN_BIN=$(find .theos -type f -name "NowEvent" ! -name "*.*" | head -n 1)
            if [ -z "$NEN_BIN" ] || [ ! -s "$NEN_BIN" ]; then
              echo "### ❌ FATAL: NowEvent binary not found in .theos!" >> "$GITHUB_STEP_SUMMARY"
              find .theos -ls >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
              exit 1
            fi

            echo "=== Executable Binary Info ==="
            ls -la "$NEN_BIN"
            file "$NEN_BIN"

            # Stage clean NowEvent.app bundle
            STAGED_APP="$GITHUB_WORKSPACE/build_out/NowEvent.app"
            rm -rf "$STAGED_APP"
            mkdir -p "$STAGED_APP"
            cp -f "$NEN_BIN" "$STAGED_APP/NowEvent"
            cp -rf Resources/* "$STAGED_APP/" 2>/dev/null || true
            chmod 0755 "$STAGED_APP/NowEvent"
            ldid -Sentitlements.xml "$STAGED_APP/NowEvent" 2>/dev/null || true

            # 2. Build TrollStore .tipa & .ipa using pack_tipa.py
            python3 "$GITHUB_WORKSPACE/scripts/pack_tipa.py" "$STAGED_APP" "$GITHUB_WORKSPACE/build_out/NowEventNotification.tipa" "$GITHUB_WORKSPACE/build_out/NowEventNotification.ipa"

            # 3. Build Rootful .deb (Standard iphoneos-arm)
            echo "Packaging rootful deb using staged app..."
            rm -rf deb_rootful
            mkdir -p deb_rootful/DEBIAN deb_rootful/Applications
            cp -r "$STAGED_APP" deb_rootful/Applications/NowEvent.app
            cp control deb_rootful/DEBIAN/control
            cp layout/DEBIAN/postinst deb_rootful/DEBIAN/postinst
            python3 "$GITHUB_WORKSPACE/scripts/pack_deb.py" deb_rootful "$GITHUB_WORKSPACE/build_out/NowEventNotification_Rootful_arm.deb"
            cp "$GITHUB_WORKSPACE/build_out/NowEventNotification_Rootful_arm.deb" "$GITHUB_WORKSPACE/build_out/NowEventNotification_2.1_iphoneos-arm.deb"
            rm -rf deb_rootful

            # 4. Build Rootless .deb (Dopamine / palera1n iphoneos-arm64)
            echo "Packaging rootless deb using staged app..."
            rm -rf deb_rootless
            mkdir -p deb_rootless/DEBIAN deb_rootless/var/jb/Applications
            cp -r "$STAGED_APP" deb_rootless/var/jb/Applications/NowEvent.app
            python3 "$GITHUB_WORKSPACE/scripts/prep_rootless_control.py" control deb_rootless/DEBIAN/control
            cp layout/DEBIAN/postinst deb_rootless/DEBIAN/postinst
            python3 "$GITHUB_WORKSPACE/scripts/pack_deb.py" deb_rootless "$GITHUB_WORKSPACE/build_out/NowEventNotification_Rootless_arm64.deb"
            rm -rf deb_rootless

            # 5. Verify all output packages exist and are valid size (>50KB)
            python3 "$GITHUB_WORKSPACE/scripts/verify_packages.py" "$GITHUB_WORKSPACE/build_out"

            cd "$GITHUB_WORKSPACE"
          fi

      - name: Generate Multi-Product Sileo APT Repository
        run: |
          STAGE_DIR="$GITHUB_WORKSPACE/sileo_stage"
          mkdir -p "$STAGE_DIR/debs" "$STAGE_DIR/downloads" "$STAGE_DIR/icons" "$STAGE_DIR/depictions"

          # 1. First copy static baseline packages from packages/ (if any exist)
          if [ -d "packages" ]; then
            cp -v packages/*.deb "$STAGE_DIR/debs/" 2>/dev/null || true
          fi

          # 2. Copy freshly built ZTech packages (overwriting any static ones)
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootful_arm.deb" "$STAGE_DIR/debs/gaulmt_Tech_Rootful_arm.deb"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootless_arm64.deb" "$STAGE_DIR/debs/gaulmt_Tech_Rootless_arm64.deb"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootless_arm64.deb" "$STAGE_DIR/debs/ZTech_Rootless_arm64.deb"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_Rootful_arm.deb" "$STAGE_DIR/debs/ZTech_Rootful_arm.deb"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_TrollStore.tipa" "$STAGE_DIR/debs/gaulmt_Tech_TrollStore.tipa"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_TrollStore.tipa" "$STAGE_DIR/debs/ZTech_TrollStore.tipa"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_TrollStore.tipa" "$STAGE_DIR/downloads/gaulmt_Tech_TrollStore.tipa"
          cp "$GITHUB_WORKSPACE/build_out/gaulmt_Tech_App.ipa" "$STAGE_DIR/downloads/gaulmt_Tech_App.ipa" 2>/dev/null || true

          # 3. Copy freshly built NowEvent packages (overwriting any static ones)
          if [ -f "$GITHUB_WORKSPACE/build_out/NowEventNotification_Rootless_arm64.deb" ]; then
            cp "$GITHUB_WORKSPACE/build_out/NowEventNotification_Rootless_arm64.deb" "$STAGE_DIR/debs/"
          fi
          if [ -f "$GITHUB_WORKSPACE/build_out/NowEventNotification_Rootful_arm.deb" ]; then
            cp "$GITHUB_WORKSPACE/build_out/NowEventNotification_Rootful_arm.deb" "$STAGE_DIR/debs/"
          fi
          if [ -f "$GITHUB_WORKSPACE/build_out/NowEventNotification_2.1_iphoneos-arm.deb" ]; then
            cp "$GITHUB_WORKSPACE/build_out/NowEventNotification_2.1_iphoneos-arm.deb" "$STAGE_DIR/debs/"
          fi
          if [ -f "$GITHUB_WORKSPACE/build_out/NowEventNotification.tipa" ]; then
            cp "$GITHUB_WORKSPACE/build_out/NowEventNotification.tipa" "$STAGE_DIR/downloads/"
            cp "$GITHUB_WORKSPACE/build_out/NowEventNotification.tipa" "$STAGE_DIR/debs/"
          fi
          if [ -f "$GITHUB_WORKSPACE/build_out/NowEventNotification.ipa" ]; then
            cp "$GITHUB_WORKSPACE/build_out/NowEventNotification.ipa" "$STAGE_DIR/downloads/"
          fi

          # 3. Copy downloads (including NowEventNotification.apk)
          if [ -d "downloads" ]; then
            cp -rv downloads/* "$STAGE_DIR/downloads/" 2>/dev/null || true
          fi

          # 4. Copy icons & depictions
          if [ -d "icons" ]; then
            cp -rv icons/* "$STAGE_DIR/icons/" 2>/dev/null || true
          fi
          if [ -d "depictions" ]; then
            cp -rv depictions/* "$STAGE_DIR/depictions/" 2>/dev/null || true
          fi

          # 5. Copy resources
          if [ -f "ZTech_iOS/Resources/CydiaIcon.png" ]; then
            cp ZTech_iOS/Resources/CydiaIcon*.png "$STAGE_DIR/"
            cp ZTech_iOS/Resources/admin.html "$STAGE_DIR/admin.html"
            cp ZTech_iOS/Resources/licenses.json "$STAGE_DIR/licenses.json"
          elif [ -f "Resources/CydiaIcon.png" ]; then
            cp Resources/CydiaIcon*.png "$STAGE_DIR/"
            cp Resources/admin.html "$STAGE_DIR/admin.html"
            cp Resources/licenses.json "$STAGE_DIR/licenses.json"
          fi

          # Preserve existing online customer licenses.json from gh-pages if available
          if curl -fsSL "https://raw.githubusercontent.com/gaulmt/gaulmt.github.io/gh-pages/licenses.json" -o "$STAGE_DIR/licenses_live.json"; then
            if grep -q '"keys"' "$STAGE_DIR/licenses_live.json"; then
              mv "$STAGE_DIR/licenses_live.json" "$STAGE_DIR/licenses.json"
            else
              rm -f "$STAGE_DIR/licenses_live.json"
            fi
          fi

          cd "$STAGE_DIR"
          dpkg-scanpackages -m debs > Packages
          gzip -c9 Packages > Packages.gz
          bzip2 -c9 Packages > Packages.bz2
          xz -c9 Packages > Packages.xz
          zstd -c19 Packages -o Packages.zst || true

          cd "$GITHUB_WORKSPACE"
          python3 scripts/generate_release.py "$STAGE_DIR"
          python3 scripts/generate_index.py "$STAGE_DIR"

          REPO_DIR="$GITHUB_WORKSPACE/sileo_repo"
          mkdir -p "$REPO_DIR" "$REPO_DIR/ztech-ios"
          cp -r "$STAGE_DIR/"* "$REPO_DIR/"
          cp -r "$STAGE_DIR/"* "$REPO_DIR/ztech-ios/"

      - name: Deploy Sileo Repo to gh-pages branch
        run: |
          cd "$GITHUB_WORKSPACE/sileo_repo"
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Auto-deploy Multi-Product Sileo APT Repository [skip ci]"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Diagnostics & Log Export
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          echo "=== NOWEVENT BUILD LOG ===" > ci_debug.log
          if [ -f "NowEvent_iOS/build_nen.log" ]; then
            cat NowEvent_iOS/build_nen.log >> ci_debug.log
          else
            echo "build_nen.log not found" >> ci_debug.log
          fi
          echo "=== BUILD OUT ===" >> ci_debug.log
          ls -la build_out >> ci_debug.log 2>&1 || true
          git add -f ci_debug.log
          git commit -m "ci: build log [skip ci]" || true
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs || true

      - name: Upload Built Packages (.deb, .tipa, .ipa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaulmt-Tech-iOS-Packages
          path: |
            build_out/*.deb
            build_out/*.tipa
            build_out/*.ipa
          if-no-files-found: warn
